[project]
name = "synthetick"
version = "0.4.0"
authors = [
    {name="Marcello Chiuminatto", email="mch@thequantick.net"},
]
description = "Synthetic historic tick data through an API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "numpy>=2.4.6",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/mchiuminatto/synthetick"
Issues = "https://github.com/mchiuminatto/synthetick/issues"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

